# GitHub Actions build matrix: one entry per half of every keyboard.
# Keymaps: config/<shield>.keymap -> shared config/keymap.dtsi
# Settings: config/default.conf (all builds) + config/<shield>.conf for each
# shield named here: prospector_adapter.conf is every dongle's,
# nice_view.conf every left half's nice!view, <keyboard>.conf one keyboard's.
# ZMK merges default.conf last, so to make an exception for one build put
# `cmake-args: -DCONFIG_...=...` on its entry here (that beats every file).
---
include:
  # --- Urchin (nice!nano v2, no screens, RGB LED widget) ---
  - board: nice_nano//zmk
    shield: urchin_left
  - board: nice_nano//zmk
    shield: urchin_right

  # --- Urchin via Prospector dongle ---
  # Same arrangement as the Waterfowl dongle below; the right half's normal
  # build above is already a peripheral.
  - board: xiao_ble//zmk
    shield: urchin_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_SLEEP=n
  - board: nice_nano//zmk
    shield: urchin_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: urchin_left_peripheral_for_dongle

  # --- splitkb Aurora Corne (nice!nano v2, nice!view on the left, encoders) ---
  - board: nice_nano//zmk
    shield: splitkb_aurora_corne_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    # no screen on the right half: nice_view_adapter only for its SPI bus,
    # which the keymap points at the left half's screen (no display driver
    # without the nice_view shield, so nothing is drawn). ZMK also reads
    # config/nice_view.conf for nice_view_adapter (it tries the shield name's
    # shorter prefixes), so the display it turns on is turned off again here
    shield: splitkb_aurora_corne_right nice_view_adapter
    cmake-args: -DCONFIG_ZMK_DISPLAY=n

  # --- splitkb Aurora Corne via Prospector dongle ---
  - board: xiao_ble//zmk
    shield: splitkb_aurora_corne_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_SLEEP=n
  - board: nice_nano//zmk
    # peripheral; the dongle sends its nice!view the output and the other battery
    shield: splitkb_aurora_corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: splitkb_aurora_corne_left_peripheral_for_dongle

  # --- Waterfowl (nice!nano v2, nice!view on left, encoders) ---
  - board: nice_nano//zmk
    shield: waterfowl_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: waterfowl_right

  # --- Waterfowl via Prospector dongle ---
  # The dongle is the central and runs the keymap; both halves become
  # peripherals (the right half's normal build above is already one).
  - board: xiao_ble//zmk
    shield: waterfowl_dongle prospector_adapter
    # no deep sleep: no keys to wake it (overrides config/default.conf)
    cmake-args: -DCONFIG_ZMK_SLEEP=n
  - board: nice_nano//zmk
    shield: waterfowl_left nice_view_adapter nice_view
    # peripheral; the dongle sends its nice!view the output and the other battery
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: waterfowl_left_peripheral_for_dongle

  # --- Forager (Seeed XIAO nRF52840, onboard RGB LED, no display) ---
  - board: xiao_ble//zmk
    shield: forager_left rgbled_adapter
  - board: xiao_ble//zmk
    shield: forager_right rgbled_adapter

  # --- Forager via Prospector dongle ---
  # forager_dongle is the forager module's own keyless shield.
  - board: xiao_ble//zmk
    shield: forager_dongle prospector_adapter
    cmake-args: -DCONFIG_ZMK_SLEEP=n
  - board: xiao_ble//zmk
    shield: forager_left rgbled_adapter
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: forager_left_peripheral_for_dongle

  # --- settings reset, one per controller type ---
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
