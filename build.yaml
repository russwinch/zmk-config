# GitHub Actions build matrix: one entry per half of every keyboard.
# Keymaps: config/<shield>.keymap -> shared config/keymap.dtsi
# Settings: config/default.conf (all builds) + config/<shield>.conf. ZMK
# merges default.conf last, so to make an exception for one build put
# `cmake-args: -DCONFIG_...=...` on its entry here (that beats every file).
---
include:
  # --- Urchin (nice!nano v2, nice!view gem) ---
  - board: nice_nano//zmk
    shield: urchin_left nice_view_adapter nice_view_gem
  - board: nice_nano//zmk
    shield: urchin_right nice_view_adapter nice_view_gem

  # --- splitkb Aurora Corne (nice!nano v2, nice!view gem, encoders) ---
  - board: nice_nano//zmk
    shield: splitkb_aurora_corne_left nice_view_adapter nice_view_gem
  - board: nice_nano//zmk
    shield: splitkb_aurora_corne_right nice_view_adapter nice_view_gem

  # --- Waterfowl (nice!nano v2, nice!view on left, encoders) ---
  - board: nice_nano//zmk
    shield: waterfowl_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: waterfowl_right

  # --- Waterfowl via Prospector dongle ---
  # The dongle is the central and runs the keymap; both halves become
  # peripherals (the right half's normal build above is already one).
  - board: xiao_ble//zmk
    shield: waterfowl_dongle prospector_adapter
    # no deep sleep: no keys to wake it (overrides config/default.conf)
    cmake-args: -DCONFIG_ZMK_SLEEP=n
  - board: nice_nano//zmk
    shield: waterfowl_left nice_view_adapter nice_view
    # peripheral; nice!view shows both batteries and the dongle's Bluetooth
    # profile instead of ZMK's stock picture (src/half_status_screen.c)
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n -DCONFIG_NICE_VIEW_WIDGET_STATUS=n -DCONFIG_WATERFOWL_HALF_STATUS_SCREEN=y
    artifact-name: waterfowl_left_peripheral_for_dongle

  # --- Forager (Seeed XIAO nRF52840, onboard RGB LED, no display) ---
  - board: xiao_ble//zmk
    shield: forager_left rgbled_adapter
  - board: xiao_ble//zmk
    shield: forager_right rgbled_adapter

  # --- settings reset, one per controller type ---
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
