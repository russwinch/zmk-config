# The &scr_next and &scr_prev keys (config/keymap.dtsi): the next or the
# previous screen on the Prospector dongle (src/dongle_screen_fx.c).

description: Show the next (or previous) screen on the Prospector dongle

compatible: "zmk,behavior-screen-next"

include: zero_param.yaml

properties:
  back:
    type: boolean
    description: Step back through the screens instead of forward
