# The &scr_next and &scr_prev keys (config/keymap.dtsi): the next or the
# previous screen on the Prospector dongle (src/dongle_screen_fx.c). With
# `theme`, as &scr_theme has it, the next colour theme instead; with
# `brightness` (&scr_bright), the backlight's next brightness.

description: Show the next (or previous) screen, or colour theme, on the Prospector dongle

compatible: "zmk,behavior-screen-next"

include: zero_param.yaml

properties:
  back:
    type: boolean
    description: Step back through the screens instead of forward
  theme:
    type: boolean
    description: Step through the colour themes instead of the screens
  brightness:
    type: boolean
    description: Step the backlight through low, medium and high instead
