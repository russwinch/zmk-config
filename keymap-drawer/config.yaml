# keymap-drawer settings: https://github.com/caksoylar/keymap-drawer
# Regenerate the picture with keymap-drawer/draw.sh after editing keymap.dtsi.
# Modifiers are drawn with Mac symbols; on the Windows layer read ⌘ as Win.
parse_config:
  preprocess: true
  zmk_keycode_map:
    LCTRL: "⌃"
    RCTRL: "⌃"
    LALT: "⌥"
    RALT: "⌥"
    LGUI: "⌘"
    RGUI: "⌘"
    LSHFT: "⇧"
    RSHFT: "⇧"
    BSPC: "⌫"
    DEL: "⌦"
    RET: "⏎"
    SPACE: "␣"
    TAB: "⇥"
    ESC: "Esc"
    SEMI: ";"
    C_PP: "⏯"
    C_PREV: "⏮"
    C_NEXT: "⏭"
    C_PWR: "Power"
    PSCRN: "PrtSc"
    LEFT: "←"
    RIGHT: "→"
    UP: "↑"
    DOWN: "↓"
    COMMA: ","
    DOT: "."
    FSLH: "/"
    BSLH: "\\"
    SQT: "'"
    DQT: '"'
    PLUS: "+"
    MINUS: "-"
    UNDER: "_"
    PIPE: "|"
    EQUAL: "="
    EXCL: "!"
    AT: "@"
    HASH: "#"
    DLLR: "$"
    PRCNT: "%"
    CARET: "^"
    AMPS: "&"
    ASTRK: "*"
    LPAR: "("
    RPAR: ")"
    LBRC: "{"
    RBRC: "}"
    LBKT: "["
    RBKT: "]"
    TILDE: "~"
    GRAVE: "`"
  raw_binding_map:
    "&kp LG(LA(LEFT))": "Prev tab"
    "&kp LG(LA(RIGHT))": "Next tab"
    "&kp LC(LEFT)": "Desk ←"
    "&kp LC(RIGHT)": "Desk →"
    "&kp LC(UP)": "Mission Ctrl"
    "&kp LC(DOWN)": "App windows"
    "&kp LA(3)": "£"
    "&bt BT_CLR": "BT clear"
    "&bt BT_PRV": "BT prev"
    "&bt BT_NXT": "BT next"
    "&ind_bat": "Battery"
    "&to 0": "Mac"
    "&to 1": "Windows"
draw_config:
  key_h: 56
  dark_mode: auto
