# Prospector scanner firmware (the Prospector itself, not the keyboards).
# Built by .github/workflows/scanner.yml with scanner/build.yaml.
# The scanner needs ZMK main (Zephyr 4); the keyboards stay on ZMK v0.3
# (config/west.yml). There is no ZMK release newer than v0.3.0 yet, so ZMK
# main is pinned to a commit.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: russwinch
      url-base: https://github.com/russwinch
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK main, 2026-11-09
      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
      import: app/west.yml
    - name: prospector-zmk-module
      remote: russwinch
      # fork's scanner branch = t-ogura v2.2.3 (same pin as config/west.yml)
      revision: 72a71aeea816eb0f86ffc5b108b267076ce5f0af
      path: modules/prospector-zmk-module
  self:
    path: scanner
