# Every left half with a nice!view (Waterfowl, Aurora Corne), on its own or
# behind a dongle: ZMK reads config/<shield>.conf for each shield in a build,
# and those builds have the nice_view shield (build.yaml). ZMK also reads it
# for the nice_view_adapter shield (it tries shorter prefixes of a shield's
# name): the Aurora Corne's right half has that without a screen, so its
# build.yaml entry turns the display off again.

CONFIG_ZMK_DISPLAY=y
# this repo's screen (both batteries and the output: src/half_status_screen.c)
# in place of ZMK's stock picture
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_WATERFOWL_HALF_STATUS_SCREEN=y
