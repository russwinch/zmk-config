# Settings shared by every build (all keyboards, the dongles, settings_reset).
#
# Where a setting goes:
#   default.conf             every build (this file)
#   prospector_adapter.conf  every Prospector dongle
#   nice_view_gem.conf       every half with a nice-view-gem display
#   <keyboard>.conf          one keyboard: its halves and its dongle
# The middle two work because ZMK reads config/<shield>.conf for each shield
# in a build. Keep a setting in the widest file it is true for.
#
# ZMK reads this file last, so a value set here wins over the same setting in
# the others. To make an exception for one build, add
# `cmake-args: -DCONFIG_...=...` to its entry in build.yaml instead (the
# dongles do this to turn sleep off).

# --- Bluetooth ---
# Strongest transmit power (+8 dBm; the default is 0).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Deep sleep ---
# After this long without a key press a board turns its radio off and sleeps.
# The next key press wakes it (that key isn't typed) and it takes a second or
# so to reconnect. Never happens while on USB power.
# 3.600.000 ms = 1 hour
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# --- RGB LED flashes (zmk-rgbled-widget) ---
# How long the LED shows the Bluetooth connection state and the battery level.
# Widget defaults are 1000 and 2000 ms. Only boards with
# CONFIG_RGBLED_WIDGET=y use these.
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=500
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=500
