# Urchin Prospector dongle (XIAO nRF52840, USB powered).
# Display, battery fetching etc. are set up by the prospector_adapter shield.
# Options: https://github.com/carrefinho/prospector-zmk-module/tree/feat/new-status-screens#configuration
# Same screen settings as waterfowl_dongle.conf.

CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y

# The beekeeb Prospector kit has no ambient light sensor. If yours does,
# remove these two lines to get auto brightness.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK also reads urchin.conf for this shield, which turns the RGB LED widget
# on; the dongle's LED isn't wired up for it, so the build would fail.
# The battery key still works: it is passed on to the halves (see the keymap).
CONFIG_RGBLED_WIDGET=n

# Deep sleep is off for the dongle (it has no keys to wake it with). That is
# set in build.yaml, because default.conf would override it here.

# Panel and backlight off after an hour with no keys pressed
# (src/dongle_idle_backlight.c, which defaults to switching them off).
CONFIG_ZMK_IDLE_TIMEOUT=3600000

# --- Animated screens (src/dongle_screen_fx.c) ---
# The Config layer's Screen keys step through them, and the one chosen is
# remembered. START is the one shown until a choice has been saved (first
# power-up, or after a settings reset): 0 the layout chosen above, 1 Warp,
# 2 Fire, 3 Terminal, 4 Code, 5 Thermal, 6 Tracker, 7 Life, 8 Hop.
# WPM_REFERENCE: typing speed at which they run flat out.
CONFIG_DONGLE_SCREEN_FX_START=0
CONFIG_DONGLE_SCREEN_FX_WPM_REFERENCE=60
