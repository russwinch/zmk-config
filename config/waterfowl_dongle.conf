# Waterfowl Prospector dongle (XIAO nRF52840, USB powered).
# Display, battery fetching etc. are set up by the prospector_adapter shield.
# Options: https://github.com/carrefinho/prospector-zmk-module/tree/feat/new-status-screens#configuration

# Status screen layout. Classic is the default; to pick another, set
# exactly one of these (and drop the Field line):
#   CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y   layer roller, batteries, mods, BLE
#   CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y     colourful grid of rounded widgets
#   CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y  dense: layer, batteries, mods, BLE, WPM
CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y

# Field's line animation (module defaults shown):
#   ANIMATION_WPM_REFERENCE         WPM at which the lines reach full speed
#   ANIMATION_INTENSITY_DECAY_SEC   fade-out time after typing stops
#   ANIMATION_FLOW_DECAY_SEC        time for lines to settle back to idle
CONFIG_PROSPECTOR_ANIMATION_WPM_REFERENCE=70
CONFIG_PROSPECTOR_ANIMATION_INTENSITY_DECAY_SEC=30
CONFIG_PROSPECTOR_ANIMATION_FLOW_DECAY_SEC=300

# Modifier labels: CTRL/ALT/GUI/SHFT, since the keymap has Mac and Windows
# base layers (the module defaults to Mac symbols).
CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y

# The beekeeb Prospector kit has no ambient light sensor. If yours does,
# remove these two lines to get auto brightness.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK also reads waterfowl.conf for this shield, which turns the RGB LED
# widget on; the dongle's LED isn't wired up for it, so the build would fail.
# The battery key still works: it is passed on to the halves (see the keymap).
CONFIG_RGBLED_WIDGET=n

# Deep sleep is off for the dongle (it has no keys to wake it with). That is
# set in build.yaml, because default.conf would override it here.

# --- Screen backlight when idle (src/dongle_idle_backlight.c) ---
# The dongle runs off USB, so this is about the screen, not power: after
# ZMK_IDLE_TIMEOUT with no keys pressed it dims to IDLE_BRIGHTNESS, and
# BACKLIGHT_OFF_MS later it goes off. Any key brings it back to
# PROSPECTOR_FIXED_BRIGHTNESS. Set BACKLIGHT_OFF_MS=0 to only dim.
# Dims after 45 minutes, off once an hour has passed (45 + 15 minutes).
# 2.700.000 ms = 45 minutes
CONFIG_ZMK_IDLE_TIMEOUT=2700000
CONFIG_WATERFOWL_DONGLE_IDLE_BRIGHTNESS=10
# 900.000 ms = 15 minutes after dimming
CONFIG_WATERFOWL_DONGLE_BACKLIGHT_OFF_MS=900000
