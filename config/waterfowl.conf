# Waterfowl (nice!nano v2, nice!view on the left, encoders).
# Only what is particular to this board: see default.conf for the rest and
# nice_view.conf for the display.

# encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# the rollers scroll as a mouse wheel (&wheel, config/waterfowl_layout.dtsi).
# This adds a mouse to what the keyboard says it is: over Bluetooth the
# computer only sees it once it has forgotten the keyboard and paired again.
CONFIG_ZMK_POINTING=y

# RGB LED widget (off again for the dongle: prospector_adapter.conf)
CONFIG_RGBLED_WIDGET=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# battery in each half, mAh: the dongle's Debug screen turns its voltage
# into an average draw in mW (HALF_BATTERY_MAH, Kconfig)
CONFIG_HALF_BATTERY_MAH=200
