# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Waterfowl OLED Display
CONFIG_ZMK_DISPLAY=y

CONFIG_RGBLED_WIDGET=y
# RGB LED flashes: connection status and battery level both 500 ms
# (widget defaults 1000 and 2000)
CONFIG_RGBLED_WIDGET_CONN_BLINK_MS=500
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=500

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# deep sleep: shared, see default.conf
