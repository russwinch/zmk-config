# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Waterfowl OLED Display
CONFIG_ZMK_DISPLAY=y

CONFIG_RGBLED_WIDGET=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Deep sleep after an hour without a key press, so a half left switched on
# doesn't drain overnight. Waking takes a key press (which is not typed) and
# a second or so to reconnect. Ignored while on USB power. The dongle reads
# this file too and turns sleep back off in waterfowl_dongle.conf.
# 3.600.000 ms = 1 hour
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
