# Waterfowl (nice!nano v2, nice!view on the left, encoders).
# Only what is particular to this board: see default.conf for the rest.

# encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# the left half's nice!view
CONFIG_ZMK_DISPLAY=y

# RGB LED widget (off again for the dongle: prospector_adapter.conf)
CONFIG_RGBLED_WIDGET=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
