manifest:
  remotes:
    # zmk official
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # bravekarma
    - name: caksoylar
      url-base: https://github.com/caksoylar
      # kyek / duckyb
    - name: duckyb
      url-base: https://github.com/duckyb
      # nice-view-gem
    - name: m165437
      url-base: https://github.com/M165437
      # forager
    - name: carrefinho
      url-base: https://github.com/carrefinho
      # my fork of the prospector module (scanner branch = t-ogura's)
    - name: russwinch
      url-base: https://github.com/russwinch
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    - name: urchin-zmk-module
      remote: duckyb
      revision: main
    - name: forager-zmk-module
      remote: carrefinho
      # pinned: upstream main may move to newer ZMK/Zephyr board names
      revision: 3cafe6b7b26d7b538949e138fc00a148def4b2ed
    - name: prospector-zmk-module
      remote: russwinch
      # keyboard side of the Prospector scanner: status advertisement.
      # pinned: fork's scanner branch = t-ogura v2.2.3, which supports
      # ZMK v0.3 on the keyboard side
      revision: 72a71aeea816eb0f86ffc5b108b267076ce5f0af
    # These modules' main branches target ZMK main (Zephyr 4.1+);
    # their v0.3 refs match our pinned ZMK v0.3.0.
    - name: nice-view-gem
      remote: m165437
      revision: v0.3.0
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
  self:
    path: config
