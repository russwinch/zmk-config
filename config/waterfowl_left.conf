# Left half only (the central); applied on top of waterfowl.conf.

# --- Prospector scanner: broadcast status (layer, battery, ...) ---
# Central only: on ZMK v0.3 the module doesn't link on a split peripheral.
# The name is shown on the scanner (max 8 characters) and also becomes
# this keyboard's Bluetooth name.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Waterfwl"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
