# Every half with a nice!view running nice-view-gem (Urchin, Aurora Corne):
# ZMK reads config/<shield>.conf for each shield in a build, and those builds
# have the nice_view_gem shield (build.yaml). Per-board choices (the
# animation) are in <keyboard>.conf.
# Options: https://github.com/M165437/nice-view-gem/blob/main/README.md

CONFIG_ZMK_DISPLAY=y
# custom status screen (nice-view-gem's)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
