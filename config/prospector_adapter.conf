# Every Prospector dongle (XIAO nRF52840, USB powered): Waterfowl, Urchin,
# Aurora Corne and Forager.
#
# ZMK reads config/<shield>.conf for each shield in a build, and all the
# dongle builds have the prospector_adapter shield (build.yaml), so this one
# file is the dongles' settings. It is read after the keyboard's own
# <keyboard>.conf and before default.conf. For a setting only one keyboard's
# dongle should have, add a config/<keyboard>_dongle.conf (read after this
# file, so it wins); for the Forager, whose dongle shield lives in the forager
# module, use `cmake-args` on its build.yaml entry.
#
# Display, battery fetching etc. are set up by the shield itself.
# Options: https://github.com/carrefinho/prospector-zmk-module/tree/feat/new-status-screens#configuration

# --- Status screen ---
# Layout. Classic is the default; to pick another, set exactly one of these
# (and drop the Operator line):
#   CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y   layer roller, batteries, mods, BLE
#   CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y     colourful grid of rounded widgets
#   CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y     layer, batteries, mods, lines that animate as you type
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Field only (the build fails if these are set with another layout); module
# defaults shown:
#   CONFIG_PROSPECTOR_ANIMATION_WPM_REFERENCE=70         WPM at which the lines reach full speed
#   CONFIG_PROSPECTOR_ANIMATION_INTENSITY_DECAY_SEC=30   fade-out time after typing stops
#   CONFIG_PROSPECTOR_ANIMATION_FLOW_DECAY_SEC=300       time for lines to settle back to idle

# Modifier labels: CTRL/ALT/GUI/SHFT, since the keymap has Mac and Windows
# base layers (the module defaults to Mac symbols).
CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y

# The beekeeb Prospector kit has no ambient light sensor. If yours does,
# remove these two lines to get auto brightness.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50

# --- Screen backlight when idle (src/dongle_idle_backlight.c) ---
# The dongle runs off USB, so this is about the screen, not power: after
# ZMK_IDLE_TIMEOUT with no keys pressed it dims to IDLE_BRIGHTNESS, and any
# key brings it back to PROSPECTOR_FIXED_BRIGHTNESS.
# IDLE_BRIGHTNESS=0 switches the panel off and leaves the backlight's PWM
# running on a tiny pulse instead of stopping it: when it was stopped (the
# old BACKLIGHT_OFF_MS switch-off), the screen once stayed dark in the morning.
# 3.600.000 ms = 1 hour
CONFIG_ZMK_IDLE_TIMEOUT=3600000
CONFIG_WATERFOWL_DONGLE_IDLE_BRIGHTNESS=0
CONFIG_WATERFOWL_DONGLE_BACKLIGHT_OFF_MS=0

# --- Animated screens (src/dongle_screen_fx.c) ---
# The Config layer's Screen keys step through them, and the one chosen is
# remembered. START is the one shown until a choice has been saved (first
# power-up, or after a settings reset): 0 the layout chosen above, 1 Warp,
# 2 Fire, 3 Terminal, 4 Code, 5 Thermal, 6 Tracker, 7 Life, 8 Hop.
# WPM_REFERENCE: typing speed at which they run flat out.
CONFIG_DONGLE_SCREEN_FX_START=0
CONFIG_DONGLE_SCREEN_FX_WPM_REFERENCE=60

# --- Undoing the keyboard's own settings ---
# ZMK also reads <keyboard>.conf for a dongle build (waterfowl.conf for
# waterfowl_dongle, and so on), which turns the RGB LED widget on; the
# dongle's LED isn't wired up for it, so the build would fail. The battery
# key still works: it is passed on to the halves (see the keymap).
CONFIG_RGBLED_WIDGET=n

# Deep sleep is off for the dongles (no keys to wake them with). That is set
# in build.yaml, because default.conf is read after this file and would
# override it here.
