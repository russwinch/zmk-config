# Forager (Seeed XIAO nRF52840). No display.
# Only what is particular to this board: see default.conf for the rest.
# The RGB LED widget is enabled by the rgbled_adapter shield in build.yaml.

# not using ZMK Studio (the forager shield turns it on by default on the left
# half; this file is read for the Forager's dongle too)
CONFIG_ZMK_STUDIO=n
