# Forager (Seeed XIAO nRF52840). No display.
# Only what is particular to this board: see default.conf for the rest.
# The RGB LED widget is enabled by the rgbled_adapter shield in build.yaml.

# not using ZMK Studio (the forager shield turns it on by default on the left
# half; this file is read for the Forager's dongle too)
CONFIG_ZMK_STUDIO=n

# battery in each half, mAh: the dongle's Debug screen turns its voltage
# into an average draw in mW (HALF_BATTERY_MAH, Kconfig)
CONFIG_HALF_BATTERY_MAH=120
# and its charge current, mA: the XIAO's BQ25101 at its default 50 mA (P0.13 left open); the dongle's screens estimate a
# charging half's level from it (HALF_CHARGE_MA, Kconfig)
CONFIG_HALF_CHARGE_MA=50
