# Forager (Seeed XIAO nRF52840). No display.
# ZMK Studio is enabled by default by the forager shield on the left half.
# The RGB LED widget is enabled by the rgbled_adapter shield in build.yaml.

# enable bluetooth
CONFIG_BT=y

# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y
# 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# not using ZMK Studio (the forager shield turns it on by default)
CONFIG_ZMK_STUDIO=n

# --- Prospector scanner: broadcast status (layer, battery, ...) ---
# Only the central (left) half advertises; the right half ignores this.
# The name is shown on the scanner (max 8 characters) and also becomes
# this keyboard's Bluetooth name.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Forager"
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="LEFT"
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
