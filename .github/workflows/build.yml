# Branches only: pushing a tag (e.g. settings-reset/<why>) builds nothing.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85  # same ZMK commit as config/west.yml

  # A still of each dongle screen as this commit draws it (tools/fx_preview.py
  # --stills), put on the release beside the firmware to look at and draw
  # over (e.g. on an iPad). Its own job, so the firmware is released even if
  # this fails.
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && python tools/fx_preview.py --stills --out screens
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*.png

  # One release per build, holding the firmware zip and each .uf2. The
  # Keyboard Writer app (russwinch/keyboard-writer) lists these and downloads
  # the zip of the one chosen:
  # release files need no login, unlike a run's artifacts. Builds of other
  # branches are prereleases. The release's target is the commit built, which
  # the app checks for settings-reset/<why> tags (README, Flashing).
  release:
    needs: [build, screens]
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the firmware
        run: |
          gh run download "$GITHUB_RUN_ID" --name firmware --dir firmware
          find firmware -name '*.uf2' -exec zip -q -j firmware.zip {} +
          # Each .uf2 on its own too, to download one without unzipping (e.g.
          # on an iPad). Spaces become dots, as GitHub would rename them anyway.
          mkdir assets
          find firmware -name '*.uf2' | while read -r f; do cp "$f" "assets/$(basename "$f" | tr ' ' '.')"; done
          subject="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')"
          tag="build-$GITHUB_RUN_NUMBER"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true  # a re-run
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then kind=--latest; else kind=--prerelease; fi
          # the screens' stills, as screen-<n>_<name>.png, if they were drawn
          shopt -s nullglob
          gh run download "$GITHUB_RUN_ID" --name screens --dir screens || true
          for f in screens/*.png; do cp "$f" "assets/screen-$(basename "$f")"; done
          gh release create "$tag" firmware.zip assets/*.uf2 assets/*.png --target "$GITHUB_SHA" $kind \
            --title "$GITHUB_REF_NAME · $subject" --notes "Built from $GITHUB_SHA."

      - name: Keep the newest 30
        run: |
          gh release list --limit 200 --json tagName --jq '.[30:][].tagName' |
            xargs -r -n 1 gh release delete --yes --cleanup-tag
