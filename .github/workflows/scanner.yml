# Build the Prospector scanner firmware from scanner/ (ZMK main), separately
# from the keyboards (build.yml, config/, ZMK v0.3).
name: Build scanner

on:
  push:
    paths:
      - "scanner/**"
      - ".github/workflows/scanner.yml"
  pull_request:
    paths:
      - "scanner/**"
      - ".github/workflows/scanner.yml"
  workflow_dispatch:

jobs:
  build:
    # same ZMK commit as scanner/west.yml
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
    with:
      config_path: scanner
      build_matrix_path: scanner/build.yaml
      archive_name: prospector-scanner
